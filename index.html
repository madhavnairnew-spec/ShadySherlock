<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>ShadySherlock // Forensic AI</title>
    <meta name="description" content="Immersive Forensic AI Crime Scene Reconstruction" />
    <!-- A-Frame VR/MR Library (Stable Release) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- A-Frame Environment Component for VR and Desktop Mode -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010610;
            font-family: 'Rajdhani', sans-serif;
        }

        /* 2D Desktop Overlay HUD */
        #desktop-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 255, 255, 0.4);
            background: linear-gradient(180deg, rgba(3, 22, 40, 0.9) 0%, rgba(3, 22, 40, 0) 100%);
            backdrop-filter: blur(8px);
            padding: 15px 30px;
            border-radius: 6px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pulsar {
            width: 12px;
            height: 12px;
            background-color: #ff3344;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff3344;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.85); opacity: 0.6; box-shadow: 0 0 6px #ff3344; }
            100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 16px #ff3344; }
        }

        .brand h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }

        .subtitle {
            color: #00ffff;
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }

        .system-time {
            font-family: 'Orbitron', sans-serif;
            color: #00ffff;
            font-size: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        .hud-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid rgba(0, 255, 255, 0.4);
            background: linear-gradient(0deg, rgba(3, 22, 40, 0.9) 0%, rgba(3, 22, 40, 0) 100%);
            backdrop-filter: blur(8px);
            padding: 15px 30px;
            border-radius: 6px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }

        .info-tag {
            color: #00ff55;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 14px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 8px rgba(0, 255, 85, 0.5);
        }

        .instructions {
            color: #bbbbbb;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        /* Hide the 2D desktop HUD in WebXR VR/AR immersive modes */
        .a-in-vr #desktop-hud {
            display: none;
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <script>
        // =========================================================================
        // WEB AUDIO API - FUTURISTIC SYNTHESIZED SOUND EFFECTS
        // =========================================================================
        const Synth = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playHover() {
                this.init();
                const ctx = this.ctx;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            },
            playSelect() {
                this.init();
                const ctx = this.ctx;
                
                const playTone = (freq, delay, duration, vol) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
                    
                    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
                    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + delay + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(ctx.currentTime + delay);
                    osc.stop(ctx.currentTime + delay + duration);
                };
                
                playTone(523.25, 0, 0.15, 0.08); // C5
                playTone(659.25, 0.04, 0.22, 0.08); // E5
                playTone(783.99, 0.08, 0.35, 0.12); // G5
            },
            playFilter() {
                this.init();
                const ctx = this.ctx;
                const osc = ctx.createOscillator();
                const filter = ctx.createBiquadFilter();
                const gain = ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.22);
                
                filter.type = 'lowpass';
                filter.Q.setValueAtTime(10, ctx.currentTime);
                filter.frequency.setValueAtTime(150, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(2200, ctx.currentTime + 0.22);
                
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.22);
            }
        };

        // =========================================================================
        // CUSTOM A-FRAME COMPONENTS
        // =========================================================================

        // Passthrough Manager
        AFRAME.registerComponent('mr-passthrough-manager', {
            init: function () {
                var sceneEl = this.el;
                
                sceneEl.addEventListener('enter-vr', () => {
                    if (sceneEl.is('ar-mode')) {
                        console.log("[MR] Entered AR Passthrough mode. Adjusting visuals...");
                        var env = document.querySelector('[environment]');
                        if (env) env.setAttribute('visible', 'false');
                        var sky = document.querySelector('a-sky');
                        if (sky) sky.setAttribute('visible', 'false');
                        sceneEl.renderer.setClearColor(0x000000, 0);
                    }
                });

                sceneEl.addEventListener('exit-vr', () => {
                    console.log("[MR] Exited AR/VR mode. Restoring digital landscape...");
                    var env = document.querySelector('[environment]');
                    if (env) env.setAttribute('visible', 'true');
                    var sky = document.querySelector('a-sky');
                    if (sky) sky.setAttribute('visible', 'true');
                });
            }
        });

        // Evidence Marker Component
        AFRAME.registerComponent('evidence-marker', {
            schema: {
                id: { type: 'string', default: 'E-01' },
                title: { type: 'string', default: 'Evidence' },
                description: { type: 'string', default: '...' },
                aiInsight: { type: 'string', default: 'No predictive insight available.' }
            },
            init: function () {
                var el = this.el;
                var data = this.data;
                
                this.originalScale = el.getAttribute('scale') || { x: 1, y: 1, z: 1 };
                this.hoverScale = {
                    x: this.originalScale.x * 1.1,
                    y: this.originalScale.y * 1.1,
                    z: this.originalScale.z * 1.1
                };
                
                el.addEventListener('click', (evt) => {
                    Synth.playSelect();
                    
                    var markers = document.querySelectorAll('.evidence-marker-el');
                    markers.forEach(m => {
                        var child = m.querySelector('.highlight-ring');
                        if(child) child.setAttribute('visible', 'false');
                    });
                    
                    var myRing = el.querySelector('.highlight-ring');
                    if(myRing) myRing.setAttribute('visible', 'true');
                    
                    this.el.sceneEl.emit('evidence-selected', {
                        id: data.id,
                        title: data.title,
                        description: data.description,
                        aiInsight: data.aiInsight
                    });
                });

                el.addEventListener('mouseenter', () => {
                    Synth.playHover();
                    el.setAttribute('animation__hover', {
                        property: 'scale',
                        to: `${this.hoverScale.x} ${this.hoverScale.y} ${this.hoverScale.z}`,
                        dur: 150,
                        easing: 'easeOutQuad'
                    });
                });

                el.addEventListener('mouseleave', () => {
                    el.setAttribute('animation__hover', {
                        property: 'scale',
                        to: `${this.originalScale.x} ${this.originalScale.y} ${this.originalScale.z}`,
                        dur: 150,
                        easing: 'easeOutQuad'
                    });
                });
            }
        });

        // Forensic Dashboard Controller
        AFRAME.registerComponent('forensic-dashboard', {
            init: function () {
                var sceneEl = this.el.sceneEl;
                
                var dbId = document.getElementById('db-id');
                var dbTitle = document.getElementById('db-title');
                var dbDesc = document.getElementById('db-desc');
                var dbAi = document.getElementById('db-ai');

                sceneEl.addEventListener('evidence-selected', (evt) => {
                    var data = evt.detail;
                    dbId.setAttribute('value', 'NODE: ' + data.id);
                    dbTitle.setAttribute('value', data.title.toUpperCase());
                    dbDesc.setAttribute('value', data.description);
                    dbAi.setAttribute('value', 'AI PROJECTION:\n' + data.aiInsight);
                    
                    // Visual flair
                    dbAi.setAttribute('color', '#ff3344');
                    setTimeout(() => { dbAi.setAttribute('color', '#00ffff'); }, 300);
                });
            }
        });

        // AI Reconstruction Trigger Component
        AFRAME.registerComponent('ai-reconstruction-trigger', {
            init: function () {
                var el = this.el;
                
                el.addEventListener('click', () => {
                    Synth.playFilter();
                    
                    // Trajectory Line
                    var trajectory = document.getElementById('ai-trajectory');
                    if (trajectory) {
                        trajectory.setAttribute('visible', 'true');
                        trajectory.emit('start-reconstruction');
                    }
                    
                    // Fragment Reassembly
                    var fragments = document.querySelectorAll('.fragment');
                    fragments.forEach(frag => {
                        frag.emit('reassemble');
                    });

                    // Update UI Status
                    var statusEl = document.getElementById('db-status');
                    if (statusEl) {
                        statusEl.setAttribute('value', 'AI PREDICTIVE MODE: ACTIVE');
                        statusEl.setAttribute('color', '#ff3344');
                    }
                    var statusBg = document.getElementById('db-status-bg');
                    if(statusBg) {
                        statusBg.setAttribute('color', '#4a0a10');
                    }
                });

                el.addEventListener('mouseenter', () => {
                    Synth.playHover();
                    el.setAttribute('material', 'opacity', '0.95');
                });

                el.addEventListener('mouseleave', () => {
                    el.setAttribute('material', 'opacity', '0.7');
                });
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const clockEl = document.getElementById('clock');
            const updateTime = () => {
                const now = new Date();
                clockEl.textContent = now.toTimeString().split(' ')[0];
            };
            setInterval(updateTime, 1000);
            updateTime();
        });
    </script>
</head>

<body>
    <!-- 2D Screen Space HUD -->
    <div id="desktop-hud">
        <div class="hud-header">
            <div class="brand">
                <span class="pulsar"></span>
                <h1>SHADY SHERLOCK</h1>
                <span class="subtitle">// FORENSIC AI CRIME SCENE RECONSTRUCTION</span>
            </div>
            <div class="system-time" id="clock">00:00:00</div>
        </div>
        <div class="hud-footer">
            <div class="info-tag">HARDWARE TARGET: META QUEST 3S [PASSTHROUGH READY]</div>
            <div class="instructions">Point and trigger to interact with evidence. Click 'ACTIVATE AI' for scene reconstruction.</div>
        </div>
    </div>

    <!-- 3D Spatial Scene -->
    <a-scene webxr="optionalFeatures: hit-test, dom-overlay; referenceSpaceType: local-floor"
             renderer="alpha: true; colorManagement: true;"
             mr-passthrough-manager>

        <!-- Digital Space Environment backdrop -->
        <a-entity id="environment" 
                  environment="preset: arches; playArea: 1.5; ground: flat; groundYScale: 5; skyType: atmosphere; lighting: point; lightPosition: 0 4 -2">
        </a-entity>

        <a-entity light="type: ambient; color: #081e35; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #00ffff; intensity: 0.6; castShadow: false" position="2 4 1"></a-entity>

        <!-- Camera Rig & Controllers -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="camera" camera look-controls wasd-controls position="0 1.6 0">
                <a-entity cursor="fuse: false; rayOrigin: mouse;"
                          raycaster="objects: .clickable; interval: 100">
                </a-entity>
            </a-entity>
            
            <a-entity id="leftHand" laser-controls="hand: left" 
                      raycaster="objects: .clickable; lineColor: #00ffff; lineOpacity: 0.8; far: 10">
            </a-entity>
            <a-entity id="rightHand" laser-controls="hand: right" 
                      raycaster="objects: .clickable; lineColor: #00ffff; lineOpacity: 0.8; far: 10">
            </a-entity>
        </a-entity>

        <!-- =========================================================================
             IMMERSIVE CRIME SCENE (FLOOR LEVEL)
             ========================================================================= -->
        <a-entity id="crime-scene" position="0 0 -1.5">
            
            <!-- Center Marking (Chalk outline grid) -->
            <a-plane position="0 0.01 0" rotation="-90 0 0" width="3" height="3" color="#00ffff" opacity="0.1" material="transparent: true; shader: flat;"></a-plane>
            <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="1.45" radius-outer="1.5" color="#00ffff" opacity="0.3"></a-ring>

            <!-- 1. The Victim (Stylized Holographic Wireframe) -->
            <a-entity id="victim" class="clickable evidence-marker-el" 
                      evidence-marker="id: V-01; title: Unidentified Male; description: Victim found supine. Fatal kinetic trauma to the chest cavity. No rigor mortis detected, suggesting recent time of death.; aiInsight: AI trajectory simulation reconstructs the projectile path from the origin point. The victim was struck in the torso."
                      position="0 0 0">
                <!-- Highlight Ring (Hidden by default) -->
                <a-ring class="highlight-ring" position="0 0.03 0.2" rotation="-90 0 0" radius-inner="0.6" radius-outer="0.65" color="#ff3344" opacity="0.8" visible="false"></a-ring>
                
                <!-- Body Parts -->
                <a-sphere position="0 0.1 0.8" radius="0.15" color="#00ffff" opacity="0.3" wireframe="true"></a-sphere> <!-- Head -->
                <a-box position="0 0.1 0.3" width="0.4" height="0.15" depth="0.7" color="#00ffff" opacity="0.3" wireframe="true"></a-box> <!-- Torso -->
                
                <a-cylinder position="-0.3 0.1 0.3" rotation="0 0 90" radius="0.05" height="0.5" color="#00ffff" opacity="0.3" wireframe="true"></a-cylinder> <!-- Left Arm -->
                <a-cylinder position="0.35 0.1 0.1" rotation="0 45 90" radius="0.05" height="0.5" color="#00ffff" opacity="0.3" wireframe="true"></a-cylinder> <!-- Right Arm -->
                
                <a-cylinder position="-0.15 0.1 -0.4" rotation="90 0 0" radius="0.06" height="0.8" color="#00ffff" opacity="0.3" wireframe="true"></a-cylinder> <!-- Left Leg -->
                <a-cylinder position="0.15 0.1 -0.4" rotation="90 15 0" radius="0.06" height="0.8" color="#00ffff" opacity="0.3" wireframe="true"></a-cylinder> <!-- Right Leg -->
                
                <!-- Transparent interaction bounding box -->
                <a-box position="0 0.15 0.2" width="0.9" height="0.3" depth="1.8" material="transparent: true; opacity: 0"></a-box>
            </a-entity>

            <!-- 2. Evidence: Discarded Weapon -->
            <a-entity class="clickable evidence-marker-el" position="0.6 0 0.3"
                      evidence-marker="id: E-01; title: Discarded Weapon; description: Sub-compact energy projector. Serial number filed off. Residual thermal signature detected on the barrel.; aiInsight: Grip analysis aligns with victim's right hand. Possible struggle or self-inflicted incident.">
                <a-ring class="highlight-ring" position="0 0.03 0" rotation="-90 0 0" radius-inner="0.15" radius-outer="0.18" color="#ff3344" opacity="0.8" visible="false"></a-ring>
                
                <a-cone radius-bottom="0.05" radius-top="0.01" height="0.15" position="0 0.075 -0.1" color="#ffcc00"></a-cone>
                <a-text value="1" position="0 0.2 -0.1" align="center" color="#ffcc00" scale="0.5 0.5 0.5"></a-text>
                <!-- Stylized Weapon -->
                <a-box position="0 0.02 0" width="0.1" height="0.04" depth="0.15" color="#444444" metalness="0.8"></a-box>
                
                <a-box position="0 0.1 0" width="0.3" height="0.3" depth="0.3" material="transparent: true; opacity: 0"></a-box>
            </a-entity>

            <!-- 3. Evidence: Impact Origin / Bullet Casing -->
            <a-entity class="clickable evidence-marker-el" position="-1.2 0 1.5"
                      evidence-marker="id: E-02; title: Impact Origin Point; description: Scorched flooring consistent with high-velocity discharge. Trace chemical accelerants found.; aiInsight: Origin point of kinetic trauma. Triggering AI Reconstruction will map the trajectory to the victim.">
                <a-ring class="highlight-ring" position="0 0.03 0" rotation="-90 0 0" radius-inner="0.15" radius-outer="0.18" color="#ff3344" opacity="0.8" visible="false"></a-ring>

                <a-cone radius-bottom="0.05" radius-top="0.01" height="0.15" position="0 0.075 -0.1" color="#ffcc00"></a-cone>
                <a-text value="2" position="0 0.2 -0.1" align="center" color="#ffcc00" scale="0.5 0.5 0.5"></a-text>
                <!-- Stylized burn mark -->
                <a-circle position="0 0.01 0" rotation="-90 0 0" radius="0.08" color="#ff3344" opacity="0.5"></a-circle>
                
                <a-box position="0 0.1 0" width="0.3" height="0.3" depth="0.3" material="transparent: true; opacity: 0"></a-box>
            </a-entity>

            <!-- 4. Evidence: Fragmented Object -->
            <a-entity class="clickable evidence-marker-el" position="-0.8 0 -0.5"
                      evidence-marker="id: E-03; title: Fragmented Storage Device; description: Heavily damaged personal datapad. Casing shattered by blunt force trauma.; aiInsight: Predictive structural analysis can reassemble casing fragments to extract the core. Trigger AI Reconstruction.">
                <a-ring class="highlight-ring" position="0 0.03 0" rotation="-90 0 0" radius-inner="0.2" radius-outer="0.23" color="#ff3344" opacity="0.8" visible="false"></a-ring>

                <a-cone radius-bottom="0.05" radius-top="0.01" height="0.15" position="0 0.075 -0.2" color="#ffcc00"></a-cone>
                <a-text value="3" position="0 0.2 -0.2" align="center" color="#ffcc00" scale="0.5 0.5 0.5"></a-text>
                
                <!-- Fragments to be reassembled -->
                <a-entity id="fragment-group">
                    <a-box class="fragment" position="-0.15 0.02 0.05" scale="0.06 0.02 0.06" color="#aa33ff" 
                           animation__reassemble="property: position; to: 0 0.05 0; startEvents: reassemble; dur: 2000; easing: easeInOutElastic"></a-box>
                    <a-box class="fragment" position="0.1 0.02 0.1" scale="0.06 0.02 0.06" color="#aa33ff" 
                           animation__reassemble="property: position; to: 0 0.07 0; startEvents: reassemble; dur: 2000; easing: easeInOutElastic"></a-box>
                    <a-box class="fragment" position="0 0.02 -0.15" scale="0.06 0.02 0.06" color="#aa33ff" 
                           animation__reassemble="property: position; to: 0 0.09 0; startEvents: reassemble; dur: 2000; easing: easeInOutElastic"></a-box>
                </a-entity>

                <a-box position="0 0.1 0" width="0.4" height="0.3" depth="0.4" material="transparent: true; opacity: 0"></a-box>
            </a-entity>

            <!-- AI Trajectory Line (Hidden by default, shown on AI Reconstruction trigger) -->
            <!-- From E-02 (-1.2, 0.1, 1.5) to Victim Torso (0, 0.2, 0.3) -->
            <a-entity id="ai-trajectory" visible="false">
                <a-line from="-1.2 0.1 1.5" to="0 0.2 0.3" color="#ff3344" 
                        animation__draw="property: opacity; from: 0; to: 0.8; startEvents: start-reconstruction; dur: 1500"></a-line>
                <!-- Trajectory projectile (Bullet simulation) -->
                <a-sphere position="-1.2 0.1 1.5" radius="0.04" color="#ffff00" material="emissive: #ffff00; emissiveIntensity: 1"
                          animation__move="property: position; to: 0 0.2 0.3; startEvents: start-reconstruction; dur: 1200; easing: easeInQuad; loop: true"></a-sphere>
                <!-- Impact flash at the victim -->
                <a-sphere position="0 0.2 0.3" radius="0.01" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 2; transparent: true"
                          animation__flash="property: scale; from: 1 1 1; to: 15 15 15; startEvents: start-reconstruction; delay: 1200; dur: 200; easing: easeOutQuad; loop: true"
                          animation__fade="property: material.opacity; from: 1; to: 0; startEvents: start-reconstruction; delay: 1200; dur: 200; easing: easeOutQuad; loop: true"></a-sphere>
            </a-entity>

        </a-entity>

        <!-- =========================================================================
             SPATIAL UI - FORENSIC DASHBOARD & AI CONTROLS
             ========================================================================= -->

        <!-- Forensic Details Dashboard (Floating slightly higher, angled to the user) -->
        <a-entity id="dashboard" position="1.4 1.5 -1.2" rotation="0 -35 0" forensic-dashboard>
            <a-plane width="1.8" height="1.6" color="#020e1a" 
                     material="transparent: true; opacity: 0.9; roughness: 0.2; metalness: 0.85;" 
                     geometry="skipCache: true">
                
                <a-ring radius-inner="0.89" radius-outer="0.9" scale="2.01 1.78 1" color="#00ffff" opacity="0.45" position="0 0 0.001" material="shader: flat;"></a-ring>
                
                <a-plane width="1.8" height="0.12" color="#00ffff" opacity="0.15" position="0 0.74 0.002" material="shader: flat;"></a-plane>
                <a-text value="FORENSIC ANALYSIS & AI INSIGHTS" position="-0.85 0.74 0.003" width="2.4" font="mozillavr" color="#00ffff" bold="true"></a-text>
                
                <a-entity id="data-screen" position="-0.82 0.6 0.005">
                    <a-text id="db-id" value="NODE: SELECT EVIDENCE" position="0 -0.05 0" width="2.5" font="mozillavr" color="#ffffff" bold="true"></a-text>
                    
                    <a-text id="db-title" value="SUBJECT: --" position="0 -0.15 0" width="2.0" font="mozillavr" color="#00ffff"></a-text>
                    
                    <a-text value="PHYSICAL DESCRIPTION:" position="0 -0.32 0" width="1.8" font="mozillavr" color="#bbbbbb" bold="true"></a-text>
                    <a-text id="db-desc" value="Point and select any holographic evidence marker or victim node to retrieve spatial coordinates, descriptions, and AI projections." 
                            position="0 -0.52 0" width="1.8" font="mozillavr" color="#e0e0e0" line-height="40"></a-text>

                    <!-- AI Insights Section -->
                    <a-text id="db-ai" value="AI PROJECTION:\nAwaiting selection..." 
                            position="0 -0.92 0" width="1.8" font="mozillavr" color="#00ffff" line-height="40" bold="true"></a-text>
                </a-entity>
                
                <!-- Status Badge -->
